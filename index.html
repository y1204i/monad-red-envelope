<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monad 红包 · Proof of Meet</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<style>
:root{--bg:#0d0920;--card:#18102f;--line:#3d2868;--text:#f7f2ff;--muted:#b9a9d6;--pink:#ff4fd8;--cyan:#65e5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#40207b 0,#0d0920 42%);color:var(--text);font-family:Inter,system-ui,"Microsoft YaHei",sans-serif;min-height:100vh}main{max-width:960px;margin:auto;padding:28px 18px 60px}.hero{text-align:center;padding:25px 0 12px}h1{font-size:clamp(34px,7vw,64px);margin:0;background:linear-gradient(90deg,var(--cyan),var(--pink));color:transparent;background-clip:text}.hero p{color:var(--muted);font-size:17px}.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:700;cursor:pointer;color:#160c2b;background:linear-gradient(90deg,var(--cyan),#b5fbff)}.btn.alt{background:linear-gradient(90deg,var(--pink),#ffb0ed)}.btn:disabled{opacity:.5;cursor:not-allowed}.pill{padding:10px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:rgba(24,16,47,.9);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 40px #0004}.card h2{margin-top:0}.label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}.input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#0b0718;color:#fff;font-size:15px}.stats{display:flex;justify-content:space-between;border-bottom:1px solid #342354;padding:10px 0}.value{color:var(--cyan);font-weight:700}.notice{margin:18px 0;padding:14px;border-radius:12px;background:#241647;color:#e6dafa;line-height:1.6;white-space:pre-wrap}.small{font-size:12px;color:var(--muted);word-break:break-all}a{color:var(--cyan)}footer{text-align:center;color:var(--muted);margin-top:28px;font-size:13px}
</style></head><body><main>
<section class="hero"><h1>MONAD RED ENVELOPE</h1><p>现场扫码 · 链上领取 · Proof of Meet</p><div class="bar"><button class="btn" id="connect">连接钱包</button><span class="pill" id="wallet">未连接</span><span class="pill" id="network">网络未检测</span></div></section>
<div class="notice" id="notice">第一步：点击“连接钱包”。如果你还没有 MetaMask，请先安装浏览器钱包。</div>
<section class="grid"><div class="card"><h2>创建红包</h2><p class="small">创建者需要在钱包中支付测试币。建议先用测试网演示。</p><label class="label">总金额（MON）</label><input class="input" id="amount" value="0.01" type="number" min="0.000001" step="0.001"><label class="label">红包份数</label><input class="input" id="shares" value="3" type="number" min="1" step="1"><br><br><button class="btn alt" id="create" disabled>创建红包</button></div>
<div class="card"><h2>领取红包</h2><label class="label">红包编号</label><input class="input" id="claimId" value="" placeholder="例如 1"><br><br><button class="btn" id="claim" disabled>领取红包</button><div class="stats"><span>当前红包</span><span class="value" id="current">-</span></div><div class="stats"><span>剩余份数</span><span class="value" id="remaining">-</span></div></div>
<div class="card"><h2>演示说明</h2><ol style="line-height:1.8;color:#ddd"><li>创建者输入金额和份数，点击创建。</li><li>把红包编号发给现场朋友。</li><li>朋友输入编号，点击领取。</li><li>每个钱包同一个红包只能领一次。</li></ol><p class="small">合约地址：<span id="contractText">请在代码顶部填写</span></p></div></section><footer>适合 Monad 黑客松演示 · 请勿存入真实资产</footer></main>
<script>
// 第一次使用只需修改下面三行：网络、合约地址、区块浏览器地址。
const CONFIG={chainId:'0x279f',chainName:'Monad Testnet',rpcUrls:['https://testnet-rpc.monad.xyz'],explorer:'https://testnet.monadexplorer.com',contractAddress:'在这里粘贴你部署后的合约地址'};
const ABI=['function createRedEnvelope(uint256 shares) payable returns (uint256)','function claim(uint256 id)','function getEnvelope(uint256 id) view returns (address creator,uint256 totalAmount,uint256 remainingAmount,uint256 shares,uint256 remainingShares)','function hasClaimed(uint256 id,address user) view returns (bool)','event EnvelopeCreated(uint256 indexed id,address indexed creator,uint256 amount,uint256 shares)'];
let provider,signer,contract;
const $=id=>document.getElementById(id), note=t=>$('notice').textContent=t;
function ready(){return CONFIG.contractAddress.startsWith('0x')&&CONFIG.contractAddress.length===42}
async function connect(){try{if(!window.ethereum)throw Error('没有检测到钱包。请安装 MetaMask 浏览器扩展。');provider=new ethers.BrowserProvider(window.ethereum);await provider.send('eth_requestAccounts',[]);signer=await provider.getSigner();let addr=await signer.getAddress();$('wallet').textContent=addr.slice(0,6)+'…'+addr.slice(-4);let net=await provider.getNetwork();$('network').textContent='Chain ID '+net.chainId;if(ready()){contract=new ethers.Contract(CONFIG.contractAddress,ABI,signer);$('create').disabled=false;$('claim').disabled=false;$('contractText').textContent=CONFIG.contractAddress}else note('钱包已连接，但还没有填写合约地址。请打开 index.html，找到 CONFIG.contractAddress，粘贴部署后的地址。')}catch(e){note('操作失败：'+(e.shortMessage||e.message))}}
async function ensure(){let net=await provider.getNetwork();if(net.chainId!==BigInt(CONFIG.chainId)){await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:CONFIG.chainId,chainName:CONFIG.chainName,nativeCurrency:{name:'MON',symbol:'MON',decimals:18},rpcUrls:CONFIG.rpcUrls,blockExplorerUrls:[CONFIG.explorer]}]});provider=new ethers.BrowserProvider(window.ethereum);signer=await provider.getSigner();contract=new ethers.Contract(CONFIG.contractAddress,ABI,signer)}}
$('connect').onclick=connect;$('create').onclick=async()=>{try{await ensure();let amount=$('amount').value, shares=BigInt($('shares').value);note('请在钱包里确认交易…');let tx=await contract.createRedEnvelope(shares,{value:ethers.parseEther(amount)});note('交易已提交，等待确认…\n'+tx.hash);let r=await tx.wait();let event=r.logs.map(log=>{try{return contract.interface.parseLog(log)}catch{return null}}).find(x=>x?.name==='EnvelopeCreated');if(!event)throw Error('交易成功，但未找到红包编号；请在区块浏览器查看交易');let id=Number(event.args.id);$('claimId').value=id;note('创建成功！红包编号是 '+id+'。把这个编号发给朋友。\n交易：'+CONFIG.explorer+'/tx/'+tx.hash);load(id)}catch(e){note('创建失败：'+(e.shortMessage||e.message))}};
$('claim').onclick=async()=>{try{await ensure();let id=BigInt($('claimId').value);note('请在钱包里确认领取…');let tx=await contract.claim(id);note('领取交易已提交…\n'+tx.hash);await tx.wait();note('领取成功！\n交易：'+CONFIG.explorer+'/tx/'+tx.hash);load(id)}catch(e){note('领取失败：'+(e.shortMessage||e.message))}};
async function load(id){try{let x=await contract.getEnvelope(id);$('current').textContent=id;$('remaining').textContent=x.remainingShares.toString()+' / '+x.shares.toString()}catch(e){$('current').textContent='不存在'}}
$('claimId').onchange=()=>{if(contract&&$('claimId').value)load(BigInt($('claimId').value))};
</script></body></html>
